<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Institucional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 6px 15px rgba(255, 65, 108, 0.3);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.95;
            font-weight: 300;
        }

        .container {
            max-width: 1100px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
            flex: 1;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem 1.8rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            border-top: 6px solid #ff416c;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 18px 35px rgba(0,0,0,0.15);
        }

        .card h3 {
            font-size: 1.4rem;
            color: #222;
            margin-bottom: 0.8rem;
        }

        .card p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.2s;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(255, 65, 108, 0.4);
        }

        .btn:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }

        /* Colores únicos para cada tarjeta */
        .card-asistencia { border-top-color: #4e54c8; }
        .card-asistencia .btn { background: linear-gradient(135deg, #4e54c8, #8f94fb); box-shadow: 0 4px 10px rgba(78, 84, 200, 0.4); }

        .card-inventario { border-top-color: #f7971e; }
        .card-inventario .btn { background: linear-gradient(135deg, #f7971e, #ffd200); box-shadow: 0 4px 10px rgba(247, 151, 30, 0.4); }

        .card-excursion { border-top-color: #11998e; }
        .card-excursion .btn { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 4px 10px rgba(17, 153, 142, 0.4); }

        .card-reunion { border-top-color: #834d9b; }
        .card-reunion .btn { background: linear-gradient(135deg, #834d9b, #d04ed6); box-shadow: 0 4px 10px rgba(131, 77, 155, 0.4); }

        .card-registros { border-top-color: #00b09b; }
        .card-registros .btn { background: linear-gradient(135deg, #00b09b, #96c93d); box-shadow: 0 4px 10px rgba(0, 176, 155, 0.4); }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: rgba(255, 255, 255, 0.7);
            color: #555;
            font-size: 0.9rem;
            margin-top: auto;
            backdrop-filter: blur(5px);
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

        <h1>Gestión Institucional</h1>
        <p>Selecciona una opción para comenzar a trabajar</p>
    </header>
